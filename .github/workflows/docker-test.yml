name: Docker image build test

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "DockerEntrypoint.sh"
      - "DockerInit.sh"
      - "scripts/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/docker-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build supported Docker platforms without publishing
        shell: bash
        run: |
          set -o pipefail
          if docker buildx build --progress=plain \
            --platform linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386 \
            . 2>&1 | tee /tmp/docker-build.log; then
            exit 0
          fi
          python3 - <<'PYLOG'
          from pathlib import Path
          output = Path('/tmp/docker-build.log').read_text(errors='replace')[-6000:]
          output = output.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print(f'::error title=docker-build-output::{output}')
          PYLOG
          exit 1

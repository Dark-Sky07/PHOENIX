name: CI

on:
  # Allow running the suite against the default branch on demand (e.g. after a
  # CI-config-only change, which the path filters below would not trigger).
  workflow_dispatch:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "scripts/**"
      - "update.sh"
      - "install.sh"
      - "install-phoenix.sh"
      - "phoenix.sh"
      - "x-ui.sh"
      - ".nvmrc"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - "**"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - "scripts/**"
      - "update.sh"
      - "install.sh"
      - "install-phoenix.sh"
      - "phoenix.sh"
      - "x-ui.sh"
      - ".nvmrc"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  update-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify transactional update rollback guards
        run: bash scripts/update-transaction-test.sh
      - name: Verify paired installer and management scripts
        run: cmp -s install.sh install-phoenix.sh && cmp -s phoenix.sh x-ui.sh
      - name: Test isolated Simurgh update and rollback
        run: python3 scripts/test_update_simurgh.py
      - name: Test bundled Simurgh menu service isolation
        run: python3 scripts/test_simurgh_launcher.py
      - name: Test upstream-compatible Simurgh role detection
        run: python3 scripts/test_simurgh_role.py

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Verify Go formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go list ./... | grep -v '/frontend/node_modules/' > /tmp/go-packages.txt
          if go test $(cat /tmp/go-packages.txt) 2>&1 | tee /tmp/go-test.log; then
            exit 0
          fi
          python3 - <<'PYLOG'
          from pathlib import Path
          output = Path('/tmp/go-test.log').read_text(errors='replace')[-4000:]
          output = output.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print(f'::error title=go-test-output::{output}')
          PYLOG
          exit 1
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Regenerate schemas, examples and OpenAPI
        run: npm run gen
        working-directory: frontend
      - name: Fail if generated files are stale (run 'npm run gen' and commit')
        run: git diff --exit-code -- frontend/src/generated frontend/public/openapi.json

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Stub internal/web/dist for go:embed
        run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Security advisories are a merge gate; update affected dependencies or
      # document a narrowly justified exception before releasing.
      - name: Run govulncheck
        shell: bash
        run: |
          if govulncheck ./... > /tmp/govulncheck.log 2>&1; then
            cat /tmp/govulncheck.log
            exit 0
          fi
          python3 - <<'PYLOG'
          from pathlib import Path
          output = Path('/tmp/govulncheck.log').read_text(errors='replace')[-4000:]
          output = output.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print(f'::error title=govulncheck-output::{output}')
          PYLOG
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Audit
        run: npm audit --audit-level=moderate
        working-directory: frontend

name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

# This workflow only reads the repository. It must never receive deployment,
# package-publish, or environment credentials.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect committed secrets
        # v3.0.0; pinned to an immutable commit for supply-chain integrity.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A finding must not be copied into a PR comment, where it could
          # increase exposure. GitHub Actions logs and the security response
          # process remain the reporting path.
          GITLEAKS_ENABLE_COMMENTS: "false"

name: Release PHOENIX

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — Go's //go:embed
      # all:dist directive in internal/web/web.go requires internal/web/dist/ to exist
      # at compile time. internal/web/dist/ is .gitignored, so on a fresh CI
      # checkout it doesn't exist until vite emits it.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build PHOENIX
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
            armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
            armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
            armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
            386) BOOTLIN_ARCH="x86-i686" ;;
            s390x) BOOTLIN_ARCH="s390x-z13" ;;
          esac
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=""
          for attempt in 1 2 3 4 5; do
            TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1) || true
            [ -n "$TARBALL_URL" ] && break
            echo "Bootlin listing failed (attempt $attempt), retrying..."
            sleep $((5 * attempt))
          done
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          for attempt in 1 2 3 4 5; do
            curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL" && break
            echo "Bootlin download failed (attempt $attempt), retrying..."
            sleep $((5 * attempt))
          done
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          PANEL_VERSION=""
          case "${GITHUB_REF_NAME:-}" in
            v[0-9]*.[0-9]*.[0-9]*) PANEL_VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          PANEL_LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [ -n "$PANEL_VERSION" ]; then
            PANEL_LDFLAGS="$PANEL_LDFLAGS -X github.com/Dark-Sky07/phoenix/internal/config.version=$PANEL_VERSION"
          fi
          echo "Building panel version ${PANEL_VERSION:-embedded default}"
          for attempt in 1 2 3; do
            go build -ldflags "$PANEL_LDFLAGS" -o xui-release -v main.go && break
            echo "go build failed (attempt $attempt), retrying..."
            sleep $((10 * attempt))
          done
          [ -f xui-release ] || { echo "go build did not produce xui-release" >&2; exit 1; }
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          cp x-ui.sh x-ui/phoenix
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          cd x-ui/bin

          # Download the highest published Xray-core release so each panel
          # bundle ships with the same current core across architectures.
          XRAY_VERSION="$(../../scripts/resolve-xray-version.sh)"
          echo "Using latest Xray-core ${XRAY_VERSION}"
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-64.zip
            unzip Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-arm64-v8a.zip
            unzip Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-arm32-v7a.zip
            unzip Xray-linux-arm32-v7a.zip
            rm -f Xray-linux-arm32-v7a.zip
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-arm32-v6.zip
            unzip Xray-linux-arm32-v6.zip
            rm -f Xray-linux-arm32-v6.zip
          elif [ "${{ matrix.platform }}" == "386" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-32.zip
            unzip Xray-linux-32.zip
            rm -f Xray-linux-32.zip
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-arm32-v5.zip
            unzip Xray-linux-arm32-v5.zip
            rm -f Xray-linux-arm32-v5.zip
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            wget -q --tries=5 --waitretry=5 ${Xray_URL}Xray-linux-s390x.zip
            unzip Xray-linux-s390x.zip
            rm -f Xray-linux-s390x.zip
          fi
          rm -f geoip.dat geosite.dat
          wget -q --tries=5 --waitretry=5 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q --tries=5 --waitretry=5 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          # Xray uses arm32 for both 32-bit ARM variants at runtime, while
          # the release archive keeps the mtg and panel platform names stable.
          case "${{ matrix.platform }}" in
            armv5|armv6|armv7) XRAY_NAME="arm32" ;;
            *) XRAY_NAME="${{ matrix.platform }}" ;;
          esac
          mv xray "xray-linux-${XRAY_NAME}"
          # mtg (MTProto sidecar) - only for arches mtg publishes
          MTG_VER="2.2.8"
          case "${{ matrix.platform }}" in
            amd64|arm64|armv7|armv6|386)
              wget -q "https://github.com/9seconds/mtg/releases/download/v${MTG_VER}/mtg-${MTG_VER}-linux-${{ matrix.platform }}.tar.gz"
              tar -xzf "mtg-${MTG_VER}-linux-${{ matrix.platform }}.tar.gz"
              case "${{ matrix.platform }}" in
                armv7|armv6) MTG_NAME="arm" ;;
                *) MTG_NAME="${{ matrix.platform }}" ;;
              esac
              mv "mtg-${MTG_VER}-linux-${{ matrix.platform }}/mtg" "mtg-linux-${MTG_NAME}" 2>/dev/null || mv mtg "mtg-linux-${MTG_NAME}"
              rm -rf "mtg-${MTG_VER}-linux-${{ matrix.platform }}" "mtg-${MTG_VER}-linux-${{ matrix.platform }}.tar.gz"
              ;;
          esac
          cd ../..
          (cd x-ui && sha256sum x-ui bin/* > sha256sums.txt && go version -m x-ui > sbom.txt)

      - name: Package
        run: tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: ./x-ui-linux-${{ matrix.platform }}.tar.gz

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: x-ui-linux-${{ matrix.platform }}.tar.gz
          # Never mutate assets of an existing release. A reused tag must
          # fail rather than delete, replace, or force-move published files.
          overwrite: false
          prerelease: false

  # =================================
  #  Windows Build
  # =================================
  build-windows:
    name: Build for Windows
    permissions:
      contents: write
    strategy:
      matrix:
        platform:
          - amd64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — see comment on the
      # Linux job above. This step is identical except npm runs on the
      # Windows runner here.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        shell: pwsh
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config

      - name: Build PHOENIX for Windows (CGO)
        shell: msys2 {0}
        run: |
          export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"

          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64
          export CC=x86_64-w64-mingw32-gcc

          which go
          go version
          gcc --version

          PANEL_VERSION=""
          case "${GITHUB_REF_NAME:-}" in
            v[0-9]*.[0-9]*.[0-9]*) PANEL_VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          PANEL_LDFLAGS="-w -s"
          if [ -n "$PANEL_VERSION" ]; then
            PANEL_LDFLAGS="$PANEL_LDFLAGS -X github.com/Dark-Sky07/phoenix/internal/config.version=$PANEL_VERSION"
          fi
          echo "Building panel version ${PANEL_VERSION:-embedded default}"
          go build -ldflags "$PANEL_LDFLAGS" -o xui-release.exe -v main.go

      - name: Copy and download resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir x-ui
          Copy-Item xui-release.exe x-ui\x-ui.exe
          mkdir x-ui\bin
          cd x-ui\bin

          # Keep Windows bundles on the same current core as every Linux and
          # Docker path. Select the highest numeric release tag, including
          # prereleases, so a newer core is never silently skipped. The query
          # is retried because api.github.com intermittently rate-limits the
          # shared runners (the Linux script retries for the same reason).
          $xrayVersion = ""
          $headers = @{ "User-Agent" = "PHOENIX-Release" }
          if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            $headers["Authorization"] = "Bearer $($env:GH_TOKEN)"
          }
          for ($attempt = 1; $attempt -le 4 -and [string]::IsNullOrWhiteSpace($xrayVersion); $attempt++) {
            try {
              $xrayReleases = Invoke-RestMethod -Uri "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=20" -Headers $headers
              $xrayVersion = $xrayReleases |
                Where-Object { !$_.draft -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
                Sort-Object { [version]($_.tag_name.Substring(1)) } |
                Select-Object -Last 1 -ExpandProperty tag_name
            } catch {
              Write-Host "Xray-core release query failed (attempt $attempt): $($_.Exception.Message)"
            }
            if ([string]::IsNullOrWhiteSpace($xrayVersion)) { Start-Sleep -Seconds (3 * $attempt) }
          }
          if ([string]::IsNullOrWhiteSpace($xrayVersion)) {
            $effectiveUrl = (& curl.exe -fsSL -o NUL -w "%{url_effective}" "https://github.com/XTLS/Xray-core/releases/latest").Trim()
            if ($effectiveUrl -match '/tag/(v\d+\.\d+\.\d+)$') {
              $xrayVersion = $Matches[1]
            }
          }
          if ([string]::IsNullOrWhiteSpace($xrayVersion)) {
            throw "Could not resolve the latest Xray-core version"
          }
          $Xray_URL = "https://github.com/XTLS/Xray-core/releases/download/$xrayVersion/"
          Write-Host "Using latest Xray-core $xrayVersion"
          $xrayOk = $false
          for ($attempt = 1; $attempt -le 8 -and -not $xrayOk; $attempt++) {
            try {
              Invoke-WebRequest -Uri "${Xray_URL}Xray-windows-64.zip" -OutFile "Xray-windows-64.zip" -MaximumRetryCount 2 -RetryIntervalSec 5
              Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath . -Force
              $xrayOk = $true
            } catch {
              Write-Host "Xray download/extract failed (attempt $attempt): $($_.Exception.Message)"
              Remove-Item "Xray-windows-64.zip" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $xrayOk) { throw "Could not fetch and extract Xray-windows-64.zip after 8 attempts" }
          Remove-Item "Xray-windows-64.zip" -ErrorAction SilentlyContinue
          Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip.dat" -MaximumRetryCount 10 -RetryIntervalSec 10
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite.dat" -MaximumRetryCount 10 -RetryIntervalSec 10
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat" -OutFile "geoip_IR.dat" -MaximumRetryCount 10 -RetryIntervalSec 10
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat" -OutFile "geosite_IR.dat" -MaximumRetryCount 10 -RetryIntervalSec 10
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip_RU.dat" -MaximumRetryCount 10 -RetryIntervalSec 10
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite_RU.dat" -MaximumRetryCount 10 -RetryIntervalSec 10
          Rename-Item xray.exe xray-windows-amd64.exe

          # Download mtg (MTProto sidecar) for Windows
          $MTG_VER = "2.2.8"
          Invoke-WebRequest -Uri "https://github.com/9seconds/mtg/releases/download/v$MTG_VER/mtg-$MTG_VER-windows-amd64.zip" -OutFile "mtg-windows-amd64.zip" -MaximumRetryCount 10 -RetryIntervalSec 10
          Expand-Archive -Path "mtg-windows-amd64.zip" -DestinationPath "mtg-tmp"
          $mtgExe = Get-ChildItem -Path "mtg-tmp" -Recurse -Filter "mtg.exe" | Select-Object -First 1
          Move-Item $mtgExe.FullName "mtg-windows-amd64.exe"
          Remove-Item "mtg-windows-amd64.zip", "mtg-tmp" -Recurse -Force

          cd ..
          Copy-Item -Path ..\windows_files\* -Destination . -Recurse
          $hash = (Get-FileHash -Path "x-ui.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  x-ui.exe" | Out-File -FilePath "sha256sums.txt" -Encoding ascii
          cd ..

      - name: Package to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path .\x-ui -DestinationPath "x-ui-windows-amd64.zip"

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-windows-amd64
          path: ./x-ui-windows-amd64.zip

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-windows-amd64.zip
          asset_name: x-ui-windows-amd64.zip
          # Never mutate assets of an existing release. A reused tag must
          # fail rather than delete, replace, or force-move published files.
          overwrite: false
          prerelease: false

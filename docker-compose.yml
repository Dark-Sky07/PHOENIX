services:
  phoenix:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: phoenix_app
    # hostname: yourhostname <- optional
    # The bundled Fail2ban (XUI_ENABLE_FAIL2BAN below) enforces the IP limit
    # with iptables, which needs NET_ADMIN. Without these caps a ban is logged
    # and shown in fail2ban status but never actually applied. NET_RAW covers
    # ip6tables. If you disable Fail2ban, you can drop cap_add.
    #
    # AmneziaWG works in this image: it runs embedded in the panel process
    # (amneziawg-go over a gVisor userspace netstack), so it needs no kernel
    # module and no host tooling. Publish its UDP listen port to use it.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # OpenVPN needs TUN; xl2tpd/pppd needs the PPP device. strongSwan and
    # runtime NAT/forwarding need NET_ADMIN. The host kernel must have PPP and
    # XFRM/IPsec support enabled.
    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/ppp:/dev/ppp
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/simurgh/:/etc/phoenix-simurgh/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      # For a fresh Simurgh volume, select one role manually: exit = foreign;
      # relay = Iran/user-facing. Existing Simurgh configs remain authoritative.
      # PHOENIX_SIMURGH_ROLE: "exit"
      # XUI_INIT_WEB_BASE_PATH: "/"
      # To use PostgreSQL instead of the default SQLite, run:
      #   docker compose --profile postgres up -d
      # and uncomment the two lines below.
      # XUI_DB_TYPE: "postgres"
      # XUI_DB_DSN: "postgres://xui:xui@postgres:5432/xui?sslmode=disable"
    tty: true
    ports:
      - "2053:2053"
      # Default OpenVPN inbound port; publish the custom inbound port too if
      # the panel is configured with a different value.
      - "1194:1194/udp"
      - "1194:1194/tcp"
      # L2TP/IPsec fixed listeners (one global inbound).
      - "500:500/udp"
      - "4500:4500/udp"
      - "1701:1701/udp"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: phoenix_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped